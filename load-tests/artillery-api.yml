config:
  target: "{{ $processEnvironment.LOAD_TEST_API_URL }}"
  phases:
    - name: "API warmup"
      duration: 30
      arrivalRate: 10
    - name: "API sustained 50 RPS"
      duration: 120
      arrivalRate: 50
  variables:
    authToken: "{{ $processEnvironment.LOAD_TEST_JWT }}"
  http:
    timeout: 10000
  ensure:
    maxErrorRate: 1
    p95: 500

scenarios:
  - name: "REST MQTT endpoint stress"
    flow:
      - post:
          url: "/api/v1/mqtt/detection"
          headers:
            Authorization: "Bearer {{ authToken }}"
            Content-Type: "application/json"
          json:
            jenis: "mobil"
            id: "{{ $uuid }}"
            conf: 0.92
            zona: false
            strobo: false
            kecerahan: 0.7
            latensi: 20
      - post:
          url: "/api/v1/mqtt/portal/status"
          headers:
            Authorization: "Bearer {{ authToken }}"
            Content-Type: "application/json"
          json:
            terbuka: false
            sumber: "otomatis"
